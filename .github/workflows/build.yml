name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MidageKeyboard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MidageKeyboard
          path: MidageKeyboard.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 중세국어 키보드 ${{ github.run_number }}
          make_latest: true
          body: 폰에서 아래 MidageKeyboard.apk 를 눌러 내려받아 설치하세요.
          files: MidageKeyboard.apk
